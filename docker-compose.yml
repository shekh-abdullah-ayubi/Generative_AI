version: '3.8'

services:
  # FastAPI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-rag-app
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - PINECONE_PROJECT_NAME=${PINECONE_PROJECT_NAME:-Agent-AI}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount local app directory for development (optional - comment out for production)
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt
    depends_on:
      - pinecone-init
    networks:
      - langgraph-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Pinecone initialization service (for setup/verification)
  pinecone-init:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: langgraph-pinecone-init
    command: python -c "
      import os
      from pinecone import Pinecone
      from core.config import PINECONE_API_KEY
      
      pc = Pinecone(api_key=PINECONE_API_KEY)
      print('Pinecone API is accessible.')
      print('Available indexes:', pc.list_indexes().names())
      "
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
    networks:
      - langgraph-network
    restart: "no"

networks:
  langgraph-network:
    driver: bridge

volumes:
  # Optional: persist model cache
  huggingface-models:
    driver: local
